<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Sourdough Series</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oleo+Script:wght@400;700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Every slice is a canvas</h1>
      <h2>The Sourdough Series</h2>
    </header>
    <main>
      <section class="background">
        <ul class="toasts">
          <li class="toast_salmon">
            <img class="salmon-empty" src="salmon-emptyy.png" /><img
              class="salmon"
              src="salmon.png"
            />
          </li>
          <li class="toast_butter">
            <img class="butter_empty" src="butter-empty.png" /><img
              class="butter"
              src="butter.png"
            />
          </li>
          <li>
            <img src="chocolate-empty.png" /><img
              class="chocolate"
              src="chocolate.png"
            />
          </li>
          <li>
            <img src="berry-empty.png" /><img class="berry" src="berry.png" />
          </li>
          <li>
            <img src="green-empty.png" /><img class="green" src="green.png" />
          </li>
          <li>
            <img src="banana-empty.png" /><img
              class="banana"
              src="banana.png"
            />
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
